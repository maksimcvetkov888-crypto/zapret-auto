name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: zapret-auto-windows-x64.exe
          - os: ubuntu-latest
            asset_name: zapret-auto-linux-x64
          - os: macos-latest
            asset_name: zapret-auto-macos-arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PyInstaller
      run: python -m pip install --upgrade pip pyinstaller

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: pyinstaller --onefile --uac-admin --add-data "bin;bin" --add-data "lists;lists" --add-data "general (ALT11).bat;." --name zapret-auto zapret_auto.py

    - name: Build with PyInstaller (Unix)
      if: runner.os != 'Windows'
      run: pyinstaller --onefile --add-data "bin:bin" --add-data "lists:lists" --name zapret-auto zapret_auto.py

    - name: Rename asset (Windows)
      if: runner.os == 'Windows'
      run: Move-Item dist/zapret-auto.exe dist/zapret-auto-windows-x64.exe

    - name: Rename asset (Unix)
      if: runner.os != 'Windows'
      run: |
        chmod +x dist/zapret-auto
        mv dist/zapret-auto dist/${{ matrix.asset_name }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
